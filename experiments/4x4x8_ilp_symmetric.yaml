name: 4x4x8_ilp_symmetric
slice: [4, 4, 8]
msg_size: 1
schedule: ilp_optimal_symmetric
router: ilp
ilp_time_limit_seconds: 3600
# Set T_upper = LB (OrbitGreedy gave us LB=74 as an existence witness).
# Skips the expensive binary-search above LB.
ilp_T_upper_multiplier: 1
output_dir: results/4x4x8_ilp_symmetric
